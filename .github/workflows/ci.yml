name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx sync:check
      - run: pnpm nx format:check --base=origin/main
      # Lint has a documented existing error baseline, and E2E still needs its
      # database/browser runner setup. Keep the reliable release checks blocking.
      - run: pnpm nx run-many -t test -p api web
      - run: pnpm nx run-many -t typecheck -p api web api-e2e web-e2e
      - run: pnpm nx run-many -t build -p api web
